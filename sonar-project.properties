# SonarQube Cloud project identity. Both are required for CI-based analysis;
# neither is a secret. Only the SONAR_TOKEN lives in GitHub Actions secrets.
sonar.projectKey=onboarding-team-hunter-testing_eclipse-weather-python
sonar.organization=onboarding-team-hunter-testing

# sonar.sources and sonar.tests must be disjoint sets. Rather than excluding
# the test files from a catch-all "." source, the main sources are listed
# explicitly -- an exclusion would drop them from indexing altogether and
# they would not be analysed as test code at all.
#
# NOTE: add new top-level modules here, or they will not be analysed.
sonar.sources=app.py,astro.py,providers.py,services.py,settings.py,static,templates
sonar.tests=test_app.py,tests

sonar.python.version=3.9, 3.10, 3.11, 3.12

# Coverage reports are NOT generated in CI. They are produced locally and
# committed to the repository, and the scanner ingests these committed files
# during analysis. This repo is a demonstration of how SonarQube picks up
# coverage reports, so the reports are checked in rather than built in the
# pipeline.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit-report.xml
sonar.javascript.lcov.reportPaths=coverage-js/lcov.info
