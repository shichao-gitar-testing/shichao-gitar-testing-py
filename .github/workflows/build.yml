name: Build

on:
  push:
    branches:
      - main
      - dev
      - 'feature-*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: the scan only reads the checkout.
# Pull request decoration is posted by the SonarQube Cloud app, not by
# this token, so no write scope is needed here.
permissions:
  contents: read

jobs:
  build:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # No tests are run and no dependencies are installed in CI. The pipeline
      # only checks out the code and runs the SonarQube scan; coverage and
      # test-execution reports are committed to the repository and picked up by
      # the scanner (see sonar-project.properties and the README).
      #
      # SonarQube Cloud: SONAR_TOKEN only. SONAR_HOST_URL is deliberately
      # unset -- the scanner defaults to SonarQube Cloud, and setting it would
      # point the scan back at a SonarQube Server. The project key and
      # organization come from sonar-project.properties.
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
