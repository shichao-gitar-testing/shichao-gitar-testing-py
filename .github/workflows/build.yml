name: Build

on:
  push:
    branches:
      - main
      - dev
      - 'feature-*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: the scan only reads the checkout.
# Pull request decoration is posted by the SonarQube Cloud app, not by
# this token, so no write scope is needed here.
permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        # Install from the fully pinned, hashed lock file with --require-hashes
        # so every resolved version (runtime and test tooling) is verified
        # against its recorded hash, closing the door on dependency
        # substitution. Regenerate requirements.lock.txt with pip-compile when
        # bumping versions. --only-binary :all: keeps installs from building
        # source distributions.
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements.lock.txt"
      - name: Run tests
        # Coverage is intentionally not produced in CI. Coverage reports are
        # generated locally and committed to the repository instead; see the
        # README for the commands. This step just runs the test suite.
        run: python -m pytest
      # SonarQube Cloud: SONAR_TOKEN only. SONAR_HOST_URL is deliberately
      # unset -- the scanner defaults to SonarQube Cloud, and setting it would
      # point the scan back at a SonarQube Server. The project key and
      # organization come from sonar-project.properties.
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
